# MusicD Share Card, as a container.
#
#   docker compose up -d
#
# then open http://<this machine>:8747 on any device on the network.

services:
  sharecard:
    image: ghcr.io/meltface-80/musicd-share-card:latest

    # BUILD IS LEFT ON, and the reason is a failure mode rather than a
    # preference. A GHCR package is PRIVATE the first time it is published and
    # there is no API to change that — it is a click in the repository's
    # package settings — so an unauthenticated pull answers "denied", which
    # reads as "there is no such image" and is not that at all. With `build`
    # here, Compose falls back to building from this checkout when the pull
    # cannot be done, and `docker compose build` works on purpose.
    build: .
    container_name: musicd-share-card
    restart: unless-stopped

    # HOST NETWORKING IS NOT OPTIONAL IF YOU WANT DISCOVERY.
    #
    # Every way this app finds anything is multicast or broadcast: SSDP for
    # Sonos and UPnP renderers, Roon's SOOD, and Lyrion's UDP 3483. NONE of
    # those cross a Docker bridge — the container would come up healthy, answer
    # on its port, and find nothing at all, which looks exactly like a network
    # with no players on it.
    #
    # On Docker Desktop (macOS, Windows) host networking does not do this
    # either. There, or on any setup where this is not possible, delete these
    # two lines, add a `ports:` mapping, and name your players' addresses in
    # SHARECARD_HOSTS below — that path does not need multicast.
    network_mode: host

    volumes:
      # The Roon pairing token, the Discord webhooks and what the metadata
      # lookups found. Without it every restart forgets all three.
      #
      # The container runs as uid 10001, so on a first run:
      #   mkdir -p ./data && sudo chown -R 10001 ./data
      - ./data:/data

    # Everything below is optional; the defaults are what the Android build
    # uses. Uncomment `environment:` along with whichever lines you want.
    #
    # environment:
    #   # Speaker or server addresses to try before searching. Worth setting
    #   # whenever discovery cannot work - a bridge network, a guest VLAN, a
    #   # mesh router that drops multicast, players on another subnet. Comma
    #   # separated, IPv4 only.
    #   SHARECARD_HOSTS: "192.168.0.57,192.168.0.61"
    #
    #   # UNSET MEANS NO PIN IS ASKED FOR, which is the default and is not the
    #   # same as Android. The gate trusts the machine it runs on and
    #   # challenges everything else - but a server in a cupboard has no
    #   # browser on it, so every visit was a remote one and the gate applied
    #   # to everybody, for switching a room on. Set six digits here to turn
    #   # it back on; with it off, anyone who can reach the port can also
    #   # change your webhooks.
    #   SHARECARD_PIN: "123456"
    #
    #   # Only if 8747 is taken. The URL is meant to be typed, so it is a fixed
    #   # port and not one the OS picks.
    #   SHARECARD_PORT: "8747"
