name: Build

# The APK is built here rather than by hand: GitHub's runners already carry the
# Android SDK, so this is the shortest path from a commit to something
# installable. Every push produces an artifact; a tag also produces a release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: Core tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The Sonos protocol layer, the zone selection and the whole API live in
      # :core, which is a plain Kotlin/JVM module — so the part of the app most
      # worth testing is tested without an emulator or an Android SDK.
      - name: Run the core test suite
        timeout-minutes: 15
        run: ./gradlew :core:test --no-daemon --stacktrace

      # The bundled front-end is JavaScript with no build step, so nothing else
      # would notice a call to something that no longer exists — and the person
      # who would find out is looking at a blank card with no console.
      - name: Lint the bundled front-end for undefined references
        run: |
          npm install --no-save --silent eslint
          npx eslint --config tools/eslint.config.mjs app/src/main/assets/web/*.js

      # CSS has no errors to report: a rule the browser cannot parse is dropped
      # in silence. Nothing else in this repo reads the stylesheet.
      - name: Check the stylesheet parses as intended
        run: node tools/check-css.js

      # The card is a canvas drawing and there is no browser in CI, so what is
      # checked is the pair of promises that would break quietly: the blurb
      # stays readable on a white sleeve, and it is never truncated.
      - name: Check the share card's blurb
        run: node tools/check-sharecard.js

      # Sixteen PNGs cut from one render, read by nothing in this repo — only by
      # a launcher and a Home Screen, neither of which is here. An output edited
      # by hand, or a half-regenerated set after the source changed, would show
      # up as two platforms displaying different icons and nowhere else.
      # The launcher decides which build a container boots, and its one
      # unforgivable failure is a container that cannot boot at all. Reading it
      # is not evidence, so it is driven through every case against throwaway
      # directories — including an update that crashes, twice, as Docker would.
      - name: Check the container launcher
        run: sh tools/check-launcher.sh

      - name: Check the icons are what the source produces
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 tools/check-icons.py

      # THE CONTAINER'S ENTRY POINT, COMPILED HERE rather than only inside the
      # image build. It is thirty seconds on a runner that is already warm, and
      # without it a broken :server is first reported by a Docker build several
      # minutes later, in a log nobody reads until the image is wanted.
      #
      # -Psharecard.serverOnly=true is what the image uses too: it drops :app
      # from the build, so this needs no Android SDK.
      - name: Build the container's server
        run: ./gradlew :server:installDist -Psharecard.serverOnly=true --no-daemon --stacktrace

      # The image copies one path out of that build, and the two have already
      # disagreed once: renaming the published archive moved the directory
      # installDist writes to, the old one lingered in a local build tree, and
      # the break only showed up in the image job minutes later. Checked here,
      # where it costs nothing and fails with the answer in the message.
      - name: Check the image copies a path the build produces
        run: sh tools/check-docker-paths.sh

      # One publisher, and it is the default branch. Two of them means a
      # conflict in dist/latest.json, README.md and docs/index.html on every
      # pull request, which is how this repo spent several releases.
      - name: Check only the default branch publishes
        run: sh tools/check-publish.sh

      # A cache may never break the thing it caches. The image job went red on
      # a layer cache it was not allowed to write, having already built and
      # pushed the image it would have sped up.
      - name: Check a refused cache cannot fail a build
        run: sh tools/check-ci-cache.sh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  apk:
    name: APK
    runs-on: ubuntu-latest
    needs: core
    # A build that hangs must fail with logs rather than sit until the six-hour
    # default expires: the logs are only retrievable once the job ends.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install exactly what the build needs, here, where the download is
      # visible in the log — rather than leaving Gradle to fetch it mid-task
      # where a stall looks identical to a slow compile.
      #
      # `tools` IS NOT IN THAT LIST AND MUST NOT GO BACK. It is the OBSOLETE
      # SDK Tools bundle — the old `android` script, the standalone AVD manager
      # and monitor — superseded by cmdline-tools years ago and now REMOVED
      # from Google's repository. Nothing here ever used it: Gradle wants
      # platform-tools, a platform and build-tools, and the Android Gradle
      # Plugin drives cmdline-tools, which this action installs itself.
      #
      # It broke this job on 2026-09-14 with the runner's cmdline-tools at
      # 16.0: sdkmanager fetched the remote repository, answered `Warning:
      # Failed to find package 'tools'` and exited 1, thirteen seconds in and
      # before a line of this app was compiled. The run before it, forty
      # minutes earlier, was green on the same YAML — so when a build that
      # nobody changed goes red at a step that installs somebody else's
      # software, read the log for the package name before reading the diff.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # The signing key, from a repository secret.
      #
      # It has to be the SAME key every build or Android will not install the
      # result over the copy already on the device — a debug key is generated
      # per machine, so every runner would produce a different certificate and
      # every "update" would be refused.
      #
      # A missing secret is NOT a broken build and must not be reported as one.
      # Without the key the APK still compiles and every check still runs; the
      # only thing that cannot happen is PUBLISHING, because an unsigned APK
      # installs nowhere. So this records whether the key is available, the
      # publish step requires it, and the job starts publishing by itself once
      # the secret exists.
      - name: Restore the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SHARECARD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SHARECARD_KEYSTORE_BASE64 is not set, so this build is" \
                 "unsigned and will not be published to dist/. Everything else ran." \
                 "See the Signing section of the README."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sharecard-release.jks"
          echo "path=$RUNNER_TEMP/sharecard-release.jks" >> "$GITHUB_OUTPUT"
          echo "have_key=true" >> "$GITHUB_OUTPUT"

      - name: Run the Android unit tests
        timeout-minutes: 20
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # THE CONTAINER'S BUILD, PUBLISHED BESIDE THE APK AND FROM THE SAME RUN.
      #
      # This is what the Docker build downloads when somebody presses Update:
      # it unpacks it beside itself and restarts into it, because a container
      # cannot replace its own image without the Docker socket and this app is
      # deliberately not given one. One version number produces both, so the
      # two can never disagree about what "0.46.0" means.
      - name: Build the server distribution
        run: ./gradlew :server:distZip -Psharecard.serverOnly=true --no-daemon --stacktrace

      # AN INSTALLABLE APK, ALWAYS — whether or not the signing secret exists.
      #
      # The release build is deliberately left UNSIGNED when the secret is
      # missing, because an APK signed with a throwaway key looks fine and can
      # never be updated over. That is the right call for a published release
      # and the wrong one for somebody who just wants to try the thing, because
      # unsigned installs nowhere at all.
      #
      # So a debug APK is built alongside it. Gradle signs it with the runner's
      # own debug key, which means it installs — and it carries the two costs
      # that come with that, both named in the README: it is `debuggable`, and
      # the key is different on every runner, so the NEXT debug build has to be
      # installed over an uninstall rather than as an update.
      #
      # Once SHARECARD_KEYSTORE_BASE64 exists, the release APK is the one to
      # install and this becomes a convenience.
      - name: Assemble the debug APK
        timeout-minutes: 25
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Name the debug APK after the version
        id: debugname
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          out="musicd-share-card-${version}-debug.apk"
          cp "$apk" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.debugname.outputs.apk }}
          path: ${{ steps.debugname.outputs.apk }}

      - name: Assemble the release APK
        timeout-minutes: 25
        env:
          SHARECARD_KEYSTORE: ${{ steps.signing.outputs.path }}
          SHARECARD_KEYSTORE_PASSWORD: ${{ secrets.SHARECARD_KEYSTORE_PASSWORD }}
          SHARECARD_KEY_ALIAS: sharecard
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # An unsigned APK installs nowhere, and one signed with the wrong key
      # installs but never updates. Neither may reach dist/, and the wrong-key
      # case is invisible until somebody tries to update — so it is checked here
      # rather than discovered on a device.
      - name: Check the APK is signed with the release key
        if: steps.signing.outputs.have_key == 'true'
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -f tools/release-key.sha256 ]; then
            python3 tools/apk-cert.py "$apk" --expect-file tools/release-key.sha256
          else
            # First signed build: record the certificate so every later build is
            # checked against it. Printed, not committed, so a key change is a
            # deliberate act rather than a file that quietly follows along.
            python3 tools/apk-cert.py "$apk"
            echo "::notice::No tools/release-key.sha256 yet. Commit the SHA-256 printed" \
                 "above to pin this certificate for future builds."
          fi

      # An unsigned build is named as such. Somebody downloading a CI artifact
      # should not get a file that looks like a release and cannot install.
      - name: Name the artifact after the version
        id: name
        env:
          HAVE_KEY: ${{ steps.signing.outputs.have_key }}
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$HAVE_KEY" = "true" ]; then
            out="musicd-share-card-${version}.apk"
          else
            out="musicd-share-card-${version}-UNSIGNED.apk"
          fi
          cp "$apk" "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: ${{ steps.name.outputs.apk }}

      # Keep a directly downloadable APK in the repo, so the README can link
      # straight at it and sideloading is one tap rather than a trip through the
      # Actions UI.
      #
      # Committed once per versionName, not once per push: the APK is a build
      # output and git keeps every copy forever, so a commit on every push would
      # bloat the history for nothing. Bumping versionName is what publishes.
      #
      # This pushes with GITHUB_TOKEN, and GitHub deliberately does not fire
      # workflows for pushes made with it — so this cannot start a build loop.
      #
      # WHICH APK GETS PUBLISHED. Whichever one can actually be installed: the
      # release APK once the signing secret exists, and the debug APK until
      # then. The unsigned release is never published — it installs nowhere, and
      # a dist/ link that downloads a dead file is worse than no link.
      #
      # THE DEFAULT BRANCH IS THE ONLY PUBLISHER, AND THAT IS WHAT STOPS THE
      # CONFLICTS.
      #
      # This used to run on every branch. `dist/latest.json`, `README.md` and
      # `docs/index.html` are all GENERATED here, from the version and from
      # GITHUB_REF_NAME — so a branch and main did not merely both write them,
      # they wrote DIFFERENT bytes into every line carrying a version or a ref.
      # Two writers, three generated files, and a conflict on all three in every
      # single pull request. Reported as "this keeps happening": README.md,
      # dist/latest.json and docs/index.html, release after release, resolved by
      # hand each time. It is not a merge that keeps going wrong, it is two
      # branches generating the same files.
      #
      # A branch manifest was never read by anything either. The app reads
      # MAIN's, and a branch url stops resolving the day the branch is deleted —
      # which is the bug two comments below, the one that shipped twice. So the
      # branch build still compiles the APK, signs it, checks the signature and
      # uploads it as a workflow artifact; what it no longer does is commit a
      # manifest nothing reads, naming a url that will not last.
      #
      # WHAT IT COSTS, STATED RATHER THAN HIDDEN: while a pull request is open,
      # dist/ and the README link on that branch still name the PREVIOUS
      # version. They are corrected the moment it merges, by main's own run.
      - name: Publish the APK into dist/
        if: >-
          github.event_name == 'push'
          && github.ref_type == 'branch'
          && github.ref_name == github.event.repository.default_branch
        env:
          RELEASE_APK: ${{ steps.name.outputs.apk }}
          DEBUG_APK: ${{ steps.debugname.outputs.apk }}
          HAVE_KEY: ${{ steps.signing.outputs.have_key }}
        run: |
          set -euo pipefail
          if [ "$HAVE_KEY" = "true" ]; then
            APK="$RELEASE_APK"
          else
            APK="$DEBUG_APK"
          fi
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)

          # THE APK IS COPIED ONCE PER VERSION; THE DERIVED FILES ARE WRITTEN
          # EVERY TIME, AND THAT SPLIT IS A FIX.
          #
          # This used to exit the moment dist/$APK existed, treating "the file
          # is here" as "the manifest is right". Those came apart as soon as a
          # BRANCH published before main did: the branch wrote a manifest whose
          # url names the branch, the merge carried both the APK and that
          # manifest onto main, and main's own run then skipped — leaving main
          # telling every device to fetch the APK from a branch url, which stops
          # resolving the day that branch is deleted. The app reads main's
          # manifest, so that is not cosmetic.
          #
          # Regenerating them costs nothing (they are derived from the version
          # and the ref), and the commit below is skipped when nothing actually
          # changed, so a docs-only push still publishes nothing.
          SERVER="musicd-share-card-server-${version}.zip"
          server_src=$(find server/build/distributions -name "$SERVER" | head -1)

          copied=no
          if [ -n "$server_src" ] && [ ! -f "dist/$SERVER" ]; then
            # One at a time, like the APK: git keeps every previous version in
            # its history and the manifest names exactly one.
            git rm -q --ignore-unmatch 'dist/musicd-share-card-server-*.zip'
            mkdir -p dist
            cp "$server_src" "dist/$SERVER"
            copied=yes
          fi

          if [ ! -f "dist/$APK" ]; then
            # One APK in the tree at a time. The old one is superseded rather
            # than kept: the README links to a single file, and git still has
            # every previous version in its history.
            #
            # mkdir comes AFTER this, not before: `git rm` of the last file in a
            # directory removes the directory too, so creating it first and
            # copying afterwards fails with "No such file or directory".
            git rm -q --ignore-unmatch 'dist/musicd-share-card-*.apk'
            mkdir -p dist
            cp "$APK" "dist/$APK"
            copied=yes
          fi

          # NOTES NAME THE BUILD, NOT THE PUSH, and that is what keeps a
          # docs-only push from committing. Regenerating this line from
          # GITHUB_SHA every time made the manifest differ on every push even
          # when the APK had not moved — a commit per push, which is the churn
          # the old early-exit existed to prevent. When the APK is already
          # committed the note that came with it is still the true one.
          notes="Built from ${GITHUB_SHA}."
          if [ "$copied" = "no" ] && [ -f dist/latest.json ]; then
            previous=$(grep -oP '"notes":\s*"\K[^"]*' dist/latest.json || true)
            if [ -n "$previous" ]; then notes="$previous"; fi
          fi
          # Hash what the url actually names — the committed copy — not the
          # freshly built one beside it, which need not be byte-identical.
          sha=$(sha256sum "dist/$APK" | cut -d' ' -f1)
          # raw.githubusercontent.com and not github.com/.../raw, which only
          # redirects there. The in-app updater refuses an APK URL whose host
          # differs from the manifest's own — a manifest that can point the
          # installer anywhere is a manifest that can install anything — and the
          # app reads this file from raw.githubusercontent.com.
          # THE SERVER BLOCK IS PART OF THE SAME MANIFEST, not a second file.
          # Two manifests are two things to fall out of step, and this repo has
          # already watched that happen once — a branch build left main naming
          # an APK on a branch url. One file, one version, both halves.
          #
          # Absent when this version predates the server build, and the updater
          # reads that as "no server update here" rather than as an error.
          server_block=""
          if [ -f "dist/$SERVER" ]; then
            server_sha=$(sha256sum "dist/$SERVER" | cut -d' ' -f1)
            server_block=$(printf ',\n    "server": {\n      "url": "https://raw.githubusercontent.com/%s/%s/dist/%s",\n      "sha256": "%s"\n    }' \
              "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" "$SERVER" "$server_sha")
          fi

          cat > dist/latest.json <<JSON
          {
            "version": "$version",
            "url": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/dist/$APK",
            "sha256": "$sha",
            "signed": $( [ "$HAVE_KEY" = "true" ] && echo true || echo false ),
            "notes": "$notes"$server_block
          }
          JSON
          sed -i 's/^          //' dist/latest.json
          # The README's download link is rewritten here rather than by hand,
          # because a link that has to be remembered is a link that eventually
          # points at a version that no longer exists. Every mention, not just
          # the path: the link TEXT names the version too.
          sed -i -E "s#musicd-share-card-[0-9][0-9A-Za-z._-]*\.apk#$APK#g" README.md docs/index.html
          # And the project page's version badge, which the filename rewrite
          # above does not reach.
          sed -i -E "s#>v[0-9]+\.[0-9]+\.[0-9]+</span>#>v${version}</span>#" docs/index.html
          git add -A dist README.md docs/index.html
          # NOTHING CHANGED IS THE ORDINARY CASE, not a failure: every push to a
          # branch whose version is already published lands here.
          if git diff --cached --quiet; then
            echo "dist/ and the links already say $version on ${GITHUB_REF_NAME} — nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Publish $APK" -m "Built from ${GITHUB_SHA}."

          # THE BRANCH MAY HAVE MOVED, AND THE THING THAT MOVED IT MAY BE
          # ANOTHER RUN PUBLISHING THIS SAME VERSION.
          #
          # Two pushes a minute apart both build the same versionName, both
          # write the same APK path, and the loser's rebase hits an add/add
          # conflict on a file identical in all but its "notes" line — which
          # reds a build whose only fault was being second. A duplicate publish
          # is not a failure, so it stands down; anything else still fails
          # loudly rather than being forced through.
          for attempt in 1 2 3; do
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "published $APK to ${GITHUB_REF_NAME}"
              exit 0
            fi
            echo "the branch moved; rebasing onto it (attempt $attempt)"
            git fetch -q origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              # Read the REMOTE copy rather than resetting onto it, so a genuine
              # failure still has our commit to report.
              theirs=$(git show "origin/$GITHUB_REF_NAME:dist/latest.json" 2>/dev/null || true)
              if printf '%s' "$theirs" | grep -q "\"version\": \"${version}\"" \
                 && printf '%s' "$theirs" | grep -q "/${GITHUB_REF_NAME}/dist/${APK}"; then
                echo "another run published $version to ${GITHUB_REF_NAME} first — standing down."
                exit 0
              fi
              echo "the branch moved and it does not carry $version — refusing to guess." >&2
              exit 1
            fi
          done
          echo "could not publish after three attempts" >&2
          exit 1

      - name: Attach the APK to a tagged release
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          && steps.signing.outputs.have_key == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.apk }}

  # --------------------------------------------------------------- image ----
  #
  # THE OTHER HALF OF THE SAME PROGRAM. The APK above and this image are built
  # from one :core; what differs is the shell around it — a foreground service
  # and a WebView there, a JVM main and a mounted directory here.
  #
  # BUILT ON EVERY PUSH, PUSHED ONLY FROM main. A Dockerfile that is only
  # exercised at release time is one that breaks at release time, and the
  # failure it breaks with (a COPY of a path that moved, a module left out of
  # the server-only build) is one a branch build would have caught for free.
  # Publishing is the part that must not happen from a branch: `:latest` is what
  # a compose file pulls, and pointing it at a feature branch is the same
  # mistake the APK manifest made once already.
  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: core
    timeout-minutes: 30
    permissions:
      contents: read
      # Only needed for the push below, and only granted here rather than at the
      # top of the file so the APK job cannot write packages.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The version the image reports comes from app/build.gradle.kts, with the
      # same expression every other step here uses. ONE number: the container's
      # /api/debug is how a bug report says which build it came from, and a
      # second place to bump is a second place to forget.
      - name: Read the version
        id: version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Image version: $version"

      # Lowercased because a repository name may not contain capitals and this
      # owner has one. ${{ github.repository }} would be rejected verbatim.
      - name: Work out the image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/musicd-share-card" >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 as well as amd64, because the machine this is wanted on is as
      # likely to be a Pi or a NAS as an x86 box — and an image that only runs
      # on the architecture CI happens to use is one most of the people asking
      # for it cannot run. Built under QEMU, which is slow and is why this job
      # only does it when it is going to publish the result.
      - uses: docker/setup-qemu-action@v3
        if: github.ref == 'refs/heads/main'

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: ${{ github.ref == 'refs/heads/main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          # A CACHE MAY NEVER BREAK THE THING IT CACHES — the TtlCache rule,
          # one layer out. A run whose token is read-scoped (a re-run of a pull
          # request's run after the pull request has merged is one, and the
          # runner says so in its own log: "Cache mode: read") cannot reserve a
          # cache entry, and without this the export's refusal FAILS THE BUILD:
          # "ERROR: failed to solve: failed to reserve cache", after the image
          # had already been built and pushed. Red for a layer cache, on a build
          # whose every real output succeeded.
          cache-to: type=gha,mode=max,ignore-error=true

      # A PUSHED PACKAGE IS NOT A PULLABLE ONE, and nothing in this run says so.
      # GitHub makes a container package PRIVATE on its first publish, and an
      # unauthenticated `docker pull` of a private package answers "denied" --
      # which reads as "there is no such image" and sent the first person to try
      # it looking for a build that had in fact succeeded. There is no API to
      # change it, so the most this can do is say where the switch is.
      - name: Say where the visibility switch is
        if: github.ref == 'refs/heads/main'
        run: |
          # Single quotes, and no backticks anywhere: this is a double-quoted
          # shell string, so a backticked "docker pull" would be RUN.
          echo '::notice::If docker pull answers denied, the package is still PRIVATE.' \
               'Repository -> Packages -> musicd-share-card -> Package settings ->' \
               'Change visibility -> Public. One click, once.'
          echo "Pushed ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}"
