<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  maximum-scale and user-scalable turn pinch-zoom off. Android and desktop
  honour them; iOS Safari has ignored user-scalable since iOS 10 for
  accessibility, so app.js refuses the gesture events as well. Neither touches
  the long press, which is how iOS copies the card.
-->
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MusicD Share Card</title>

<!--
  The same font MusicD Remote uses, and the same weight set — 300..700, with no
  800 even though the card draws its score at 800.

  That omission is deliberate rather than an oversight to tidy up: the browser
  synthesises 800 from 700, and MusicD Remote's card is drawn against exactly
  that synthesis. Requesting a real 800 here would render a visibly different
  score to the app this card is supposed to match.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap">
<!--
  The same picture Android uses on its launcher, cut for the web by
  tools/make-icons.py.
  iOS will not take an SVG here, and with no apple-touch-icon it falls back to
  a screenshot or the first letter of the title — which is why Home Screen
  showed a bare "M".
-->
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<meta name="apple-mobile-web-app-title" content="Share Card">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="dot" aria-hidden="true"></span>
    <span>Share Card</span>
  </div>
  <div class="bar-right">
    <!-- Populated only when the household has more than one group: a picker
         offering one choice is a control that cannot be used. -->
    <label class="zone-wrap hidden" id="zone-wrap">
      <span class="sr-only">Room</span>
      <select id="zone" class="zone"></select>
    </label>
    <button id="refresh" class="icon-btn" aria-label="Check what is playing now">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
      </svg>
    </button>
  </div>
</header>

<!--
  The update notice, above the card so it needs no scrolling to see and no
  scrolling to dismiss. Hidden unless there is genuinely something newer.
-->
<div class="update hidden" id="update" role="status"></div>

<main class="wrap">
  <div class="stage" id="stage">
    <div class="placeholder">
      <div class="spinner"></div>
      <div>Looking for what’s playing…</div>
    </div>
  </div>

  <!--
    The iOS tip, and any notice a source has (a Roon Core waiting to be
    approved). DIRECTLY UNDER THE CARD, because it is about the card: at the
    foot of the page it sat below three rows of chips and read as a footer for
    the whole screen rather than an instruction for the picture.
  -->
  <p class="hint" id="hint"></p>
  <p class="now" id="now"></p>
  <div class="actions" id="actions"></div>

  <!--
    Where to hear it, and the review the score came from. BELOW the actions,
    not above: sharing the card is what somebody opened this for, and a row of
    seven chips between the card and the Share button would push it off a
    phone screen. Hidden until there is a record to link to.
  -->
  <nav class="links hidden" id="links" aria-label="Find this album"></nav>
  <!--
    Acts to hear next. Below the links and never on the card: the card is the
    whole message and what it says is what is playing. Empty and hidden until
    the lookup answers, because it is asked for after the card is drawn.
  -->
  <nav class="links similar hidden" id="similar" aria-label="If you like this, try these"></nav>
  <p class="err" id="err" role="status"></p>
</main>

<script src="/sharecard.js"></script>
<script src="/app.js"></script>
</body>
</html>
